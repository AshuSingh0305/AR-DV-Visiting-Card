<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Vigilantes — Card Front (Image Target)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      gap: 28px;
    }

    h1 {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    /* The actual card — standard business card ratio 3.5:2 */
    #card-container {
      width: 700px;
      height: 400px;
      position: relative;
    }

    #card-canvas {
      width: 700px;
      height: 400px;
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(74,128,196,0.2),
        0 0 60px rgba(74,128,196,0.15),
        0 30px 80px rgba(0,0,0,0.7);
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4A80C4, #2a5fa0);
      color: white;
      box-shadow: 0 4px 20px rgba(74,128,196,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(74,128,196,0.6); }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    .note {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
      text-align: center;
      max-width: 520px;
      line-height: 1.8;
    }

    @media (max-width: 740px) {
      #card-container, #card-canvas { width: 340px; height: 193px; }
    }
  </style>
</head>
<body>
  <h1>Image Target — Print &amp; Scan</h1>

  <div id="card-container">
    <canvas id="card-canvas" width="1400" height="800"></canvas>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="downloadCard()">⬇ Download as PNG</button>
    <button class="btn btn-secondary" onclick="window.print()">🖨 Print Card</button>
    <a href="ar.html" class="btn btn-primary">📷 Launch AR Scanner</a>
  </div>

  <p class="note">
    Print this card → open <strong>ar.html</strong> on your phone → point camera at this card.<br>
    The digital info card will pop up in AR.
  </p>

  <script>
    const canvas = document.getElementById('card-canvas');
    const ctx = canvas.getContext('2d');
    const W = 1400, H = 800;

    function drawCard() {
      ctx.clearRect(0, 0, W, H);

      // === Background (deep black with subtle gradient) ===
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#050a0f');
      bg.addColorStop(0.5, '#070e18');
      bg.addColorStop(1, '#050a0f');
      ctx.fillStyle = bg;
      ctx.roundRect(0, 0, W, H, 32);
      ctx.fill();

      // === Subtle grid (for AR feature detection) ===
      ctx.strokeStyle = 'rgba(74,128,196,0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 35) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 35) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // === Corner accents ===
      const cornerLen = 40;
      const cornerGap = 24;
      ctx.lineWidth = 2;

      // Top-left (blue)
      ctx.strokeStyle = 'rgba(74,128,196,0.5)';
      ctx.beginPath(); ctx.moveTo(cornerGap + cornerLen, cornerGap); ctx.lineTo(cornerGap, cornerGap); ctx.lineTo(cornerGap, cornerGap + cornerLen); ctx.stroke();
      // Bottom-right (blue)
      ctx.beginPath(); ctx.moveTo(W - cornerGap - cornerLen, H - cornerGap); ctx.lineTo(W - cornerGap, H - cornerGap); ctx.lineTo(W - cornerGap, H - cornerGap - cornerLen); ctx.stroke();

      // Top-right (red)
      ctx.strokeStyle = 'rgba(232,57,77,0.5)';
      ctx.beginPath(); ctx.moveTo(W - cornerGap - cornerLen, cornerGap); ctx.lineTo(W - cornerGap, cornerGap); ctx.lineTo(W - cornerGap, cornerGap + cornerLen); ctx.stroke();
      // Bottom-left (red)
      ctx.beginPath(); ctx.moveTo(cornerGap + cornerLen, H - cornerGap); ctx.lineTo(cornerGap, H - cornerGap); ctx.lineTo(cornerGap, H - cornerGap - cornerLen); ctx.stroke();

      // === DV Logo (centered, scaled) ===
      const logoScale = 1.35;
      const dCX = W / 2 - 112 * logoScale;
      const dCY = H / 2 - 80;
      const vCX = W / 2 + 112 * logoScale;
      const vCY = H / 2 - 80;
      const discR = 105 * logoScale;
      const shapeR = 78 * logoScale;

      // — D disc (red) —
      ctx.fillStyle = '#E8394D';
      ctx.beginPath();
      ctx.arc(dCX, dCY, discR, 0, Math.PI * 2);
      ctx.fill();

      // White D shape (right side)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(dCX, dCY - shapeR);
      ctx.lineTo(dCX, dCY + shapeR);
      ctx.arc(dCX, dCY, shapeR, Math.PI / 2, -Math.PI / 2, true);
      ctx.closePath();
      ctx.fill();

      // — V disc (blue) —
      ctx.fillStyle = '#4A80C4';
      ctx.beginPath();
      ctx.arc(vCX, vCY, discR, 0, Math.PI * 2);
      ctx.fill();

      // White bowl shape (bottom half)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(vCX - shapeR, vCY);
      ctx.lineTo(vCX + shapeR, vCY);
      ctx.arc(vCX, vCY, shapeR, 0, Math.PI, false);
      ctx.closePath();
      ctx.fill();

      // === Company Name ===
      ctx.textAlign = 'center';
      ctx.letterSpacing = '12px';
      ctx.fillStyle = '#ffffff';
      ctx.font = `800 52px 'Outfit', sans-serif`;
      ctx.fillText('DATA VIGILANTES', W / 2, H / 2 + 180);

      // === Website (small, bottom center) ===
      ctx.font = `500 18px 'JetBrains Mono', monospace`;
      ctx.fillStyle = 'rgba(74,128,196,0.45)';
      ctx.letterSpacing = '2px';
      ctx.fillText('www.datavigilantes.com', W / 2, H - 32);
    }

    // Use roundRect polyfill if needed
    if (!ctx.roundRect) {
      ctx.roundRect = function(x, y, w, h, r) {
        this.beginPath();
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
      };
    }

    drawCard();

    function downloadCard() {
      const link = document.createElement('a');
      link.download = 'data-vigilantes-card-front.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>

  <style>
    @media print {
      body { background: white; gap: 0; }
      h1, .actions, .note { display: none; }
      #card-canvas { border-radius: 0; box-shadow: none; }
    }
  </style>
</body>
</html>
